[alembic]
# La URL se sobreescribe en env.py leyendo desde config.py — este valor es el fallback
# para cuando se corre alembic directamente desde la máquina host (fuera de Docker).
script_location = migrations
sqlalchemy.url = postgresql+psycopg2://gmc_user:changeme@localhost:5432/gmc

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S